<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevStudio Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="navbar">
        <div class="logo">DevStudio</div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
        </nav>
        <button class="btn-signin">Sign In</button>
    </header>

    <main class="products-section">
        <h1 class="section-title">Our Products</h1>
        
        <div class="products-container">
            
            <div class="product-card">
                <span class="badge sale">SALE</span>
                <div class="product-image">
                    <img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcQT5ocNLlF5c6YgNUl8waJGjEN3b6Wh25Oqit-8-TH4kg0WAjZsUb0Dsc0tMQ1L0-gQqfzG5wRsI-THeFPdgsZ20ddbGzmtKP6qu8s_vJtCSBRCVGuirDXLTfpCqu2axgVAXgaLmaw&usqp=CAc" alt="Minimal Backpack">
                </div>
                <div class="product-info">
                    <h3 class="product-name">Minimal Backpack</h3>
                    <div class="product-price">
                        <span class="current-price">$45.00</span>
                        <span class="old-price">$60.00</span>
                    </div>
                    <button class="btn-cart">Add to Cart</button>
                </div>
            </div>

            
            <div class="product-card">
                <div class="product-image">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLs74v_idA5NAsVC7dYDmoaZLtA7Upbb9rp-qhHG9Dwg&s" alt="Wireless Headphones">
                </div>
                <div class="product-info">
                    <h3 class="product-name">Wireless Headphones</h3>
                    <div class="product-price">
                        <span class="current-price">$89.00</span>
                    </div>
                    <button class="btn-cart">Add to Cart</button>
                </div>
            </div>

            
            <div class="product-card">
                <span class="badge sale">SALE</span>
                <div class="product-image">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQo_0JuXhHUYamWPJoIIurNB4cIn6KGDUhxCFcvsGdmqQ&s=10" alt="Classic Watch">
                </div>
                <div class="product-info">
                    <h3 class="product-name">Classic Watch</h3>
                    <div class="product-price">
                        <span class="current-price">$120.00</span>
                        <span class="old-price">$150.00</span>
                    </div>
                    <button class="btn-cart">Add to Cart</button>
                </div>
            </div>

            
            <div class="product-card">
                <div class="product-image">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReGFslgaCI9U6R4zebGaA4MnUrPmH8WNT9y8bwCh6KLg&s=10" alt="Small Plant">
                </div>
                <div class="product-info">
                    <h3 class="product-name">Small Plant</h3>
                    <div class="product-price">
                        <span class="current-price">$15.00</span>
                    </div>
                    <button class="btn-cart">Add to Cart</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
